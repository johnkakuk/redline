<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0A0A0B;color:#F5F5F7;padding:32px;border-radius:16px;max-width:440px">
  <div style="font-size:28px;font-weight:800;letter-spacing:-0.5px">RED<span style="color:#E5162A">LINE</span></div>
  <p style="color:#A1A1AA;margin:16px 0 8px">Your login code:</p>
  <div style="font-size:40px;font-weight:700;letter-spacing:10px;margin:0 0 16px">{{ .Token }}</div>
  <p style="color:#A1A1AA;margin:0 0 24px">Type it into Redline. It expires in 15 minutes.</p>
  <p style="color:#A1A1AA;margin:0 0 8px">On a computer you can tap this instead:</p>
  <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#E5162A;color:#fff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:12px">Log in to Redline</a>
  <p style="color:#74747E;font-size:12px;margin-top:24px">If you didn’t ask for this, you can ignore it.</p>
</div>
